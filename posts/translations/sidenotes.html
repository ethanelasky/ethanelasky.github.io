<style>
/* LessWrong-style collapsible sidenotes for Quarto margin footnotes */
main.sn-active { position: relative; }
main.sn-active .column-margin.column-container { transition: top .18s ease; }
.column-margin.column-container.sn-collapsed > div[id^="fn"] { overflow: hidden; position: relative; }
.column-margin.column-container.sn-collapsed > div[id^="fn"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.4em; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,255,255,0), var(--bs-body-bg, #fff) 85%);
}
.sn-toggle { display: none; font: inherit; font-size: .78rem; line-height: 1.4; color: var(--bs-link-color, #5c7a99);
  background: none; border: 0; padding: 0; margin: .15em 0 0 0; cursor: pointer; }
.sn-toggle:hover { text-decoration: underline; }
.sn-collapsed .sn-toggle, .sn-expanded .sn-toggle { display: inline-block; }
.column-margin.column-container.sn-flash > div[id^="fn"] { animation: sn-flash 1.2s ease-out; }
@keyframes sn-flash { from { background: rgba(92,122,153,.18); } to { background: transparent; } }
</style>
<script>
(function () {
  var BREAK = 992, GAP = 14, MIN_H = 112, TOGGLE_H = 36;
  var main = document.querySelector('main#quarto-document-content');
  if (!main) return;
  // Quarto packs consecutive footnotes into one margin container; give each note its own.
  main.querySelectorAll('.column-margin.column-container').forEach(function (c) {
    var inners = Array.prototype.slice.call(c.querySelectorAll(':scope > div[id^="fn"]'));
    inners.slice(1).forEach(function (inner, i) {
      var w = document.createElement('div'); w.className = c.className;
      w.appendChild(inner);
      c.parentNode.insertBefore(w, c.nextSibling);
      c = w;
    });
  });
  var notes = [];
  main.querySelectorAll('.column-margin.column-container').forEach(function (c) {
    var inner = c.querySelector('div[id^="fn"]'); if (!inner) return;
    var ref = document.getElementById('fnref' + inner.id.slice(2)); if (!ref) return;
    var nt = { c: c, inner: inner, ref: ref, expanded: false };
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sn-toggle'; btn.textContent = 'more ▾';
    btn.addEventListener('click', function (e) { e.preventDefault(); nt.expanded = !nt.expanded; layout(); });
    c.appendChild(btn); nt.btn = btn;
    ref.addEventListener('click', function (e) {
      if (window.innerWidth < BREAK) return;
      e.preventDefault(); nt.expanded = true; layout();
      c.classList.remove('sn-flash'); void c.offsetWidth; c.classList.add('sn-flash');
      var r = c.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) window.scrollBy({ top: r.top - 80, behavior: 'smooth' });
    });
    notes.push(nt);
  });
  if (!notes.length) return;

  function reset() {
    main.classList.remove('sn-active'); main.style.minHeight = '';
    notes.forEach(function (nt) {
      nt.c.style.cssText = ''; nt.inner.style.maxHeight = ''; nt.inner.style.marginTop = '';
      nt.c.classList.remove('sn-collapsed', 'sn-expanded');
    });
  }
  function layout() {
    reset();
    if (window.innerWidth < BREAK) return;
    var mainRect = main.getBoundingClientRect();
    var col = notes[0].c.getBoundingClientRect();
    var left = col.left - mainRect.left, width = col.width;
    main.classList.add('sn-active');
    notes.forEach(function (nt) {
      nt.c.style.setProperty('grid-column', 'auto', 'important'); // else the abs-pos containing block is Quarto's margin grid area
      nt.c.style.position = 'absolute'; nt.c.style.top = '0px'; nt.c.style.left = left + 'px';
      nt.c.style.width = width + 'px'; nt.c.style.height = 'auto'; nt.c.style.margin = '0';
      nt.inner.style.marginTop = '0px'; // Quarto's own script sets a growing margin-top to align notes; we position instead
    });
    mainRect = main.getBoundingClientRect();
    var items = notes.map(function (nt) {
      var rr = nt.ref.getBoundingClientRect();
      return { nt: nt, refY: rr.top - mainRect.top - 2, natural: nt.c.offsetHeight }; // container height includes the paragraph's bottom margin
    }).sort(function (a, b) { return a.refY - b.refY; });
    var y = -Infinity, maxBottom = 0;
    items.forEach(function (it, i) {
      it.y = Math.max(it.refY, y);
      var nextRef = i + 1 < items.length ? items[i + 1].refY : Infinity;
      var avail = nextRef - it.y - GAP;
      if (it.nt.expanded) { it.h = it.natural + TOGGLE_H; it.state = 'expanded'; }
      else if (it.natural > avail + 4) { it.h = Math.max(MIN_H, Math.min(it.natural, avail)); it.state = it.h < it.natural ? 'collapsed' : 'plain'; if (it.state === 'plain') it.h = it.natural; }
      else { it.h = it.natural; it.state = 'plain'; }
      y = it.y + it.h + GAP; maxBottom = Math.max(maxBottom, it.y + it.h);
    });
    items.forEach(function (it) {
      var nt = it.nt;
      nt.c.style.top = it.y + 'px';
      if (it.state === 'collapsed') { nt.c.classList.add('sn-collapsed'); nt.inner.style.maxHeight = (it.h - TOGGLE_H) + 'px'; nt.btn.textContent = 'more ▾'; }
      else if (it.state === 'expanded') { nt.c.classList.add('sn-expanded'); nt.btn.textContent = 'less ▴'; }
    });
    if (maxBottom + 24 > mainRect.height) main.style.minHeight = (maxBottom + 24) + 'px';
  }
  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(layout, 60); }
  // Quarto re-applies its margin-top alignment on load/resize; relayout when that happens.
  var mo = new MutationObserver(function (muts) {
    if (!main.classList.contains('sn-active')) return;
    for (var i = 0; i < muts.length; i++) { var t = muts[i].target; if (t.style && t.style.marginTop && t.style.marginTop !== '0px') { schedule(); return; } }
  });
  notes.forEach(function (nt) { mo.observe(nt.inner, { attributes: true, attributeFilter: ['style'] }); });
  layout();
  window.addEventListener('resize', schedule);
  window.addEventListener('load', schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  main.querySelectorAll('img').forEach(function (img) { if (!img.complete) img.addEventListener('load', schedule); });
})();
</script>
