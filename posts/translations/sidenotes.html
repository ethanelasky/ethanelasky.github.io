<style>
/* LessWrong-style collapsible sidenotes for Quarto margin footnotes */
main.sn-active { position: relative; }
@media (min-width: 992px) { main.sn-pending .column-margin { visibility: hidden; } }
main.sn-animate .sn-note { transition: top .2s ease; }
main.sn-animate .sn-note > div[id^="fn"] { transition: max-height .2s ease; }
.sn-note.sn-collapsed > div[id^="fn"] { overflow: hidden; position: relative; }
.sn-note.sn-collapsed > div[id^="fn"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.4em; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,255,255,0), var(--bs-body-bg, #fff) 85%);
}
.sn-note.sn-expanded > div[id^="fn"] { overflow: hidden; }
.sn-toggle { display: none; font: inherit; font-size: .78rem; line-height: 1.4; color: var(--bs-link-color, #5c7a99);
  background: none; border: 0; padding: 0; margin: .15em 0 0 0; cursor: pointer; }
.sn-toggle:hover { text-decoration: underline; }
.sn-collapsed .sn-toggle, .sn-expanded .sn-toggle { display: inline-block; }
.sn-note.sn-flash > div[id^="fn"] { animation: sn-flash 1.2s ease-out; }
@keyframes sn-flash { from { background: rgba(92,122,153,.18); } to { background: transparent; } }
</style>
<script>
(function () {
  var BREAK = 992, GAP = 14, MIN_H = 112, TOGGLE_H = 36;
  var main = document.querySelector('main#quarto-document-content');
  if (!main) return;
  main.classList.add('sn-pending');

  // Quarto packs consecutive footnotes into one margin container; give each note its own.
  main.querySelectorAll('.column-margin.column-container').forEach(function (c) {
    var inners = Array.prototype.slice.call(c.querySelectorAll(':scope > div[id^="fn"]'));
    inners.slice(1).forEach(function (inner) {
      var w = document.createElement('div'); w.className = c.className; w.appendChild(inner);
      c.parentNode.insertBefore(w, c.nextSibling); c = w;
    });
  });
  var notes = [];
  main.querySelectorAll('.column-margin.column-container').forEach(function (c) {
    var inner = c.querySelector('div[id^="fn"]'); if (!inner) return;
    var ref = document.getElementById('fnref' + inner.id.slice(2)); if (!ref) return;
    var nt = { c: c, inner: inner, ref: ref, expanded: false };
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sn-toggle'; btn.textContent = 'more ▾';
    btn.addEventListener('click', function (e) { e.preventDefault(); nt.expanded = !nt.expanded; animate(function () { place(); }); });
    c.appendChild(btn); nt.btn = btn;
    ref.addEventListener('click', function (e) {
      if (!desktop) return;
      e.preventDefault(); nt.expanded = true; animate(function () { place(); });
      c.classList.remove('sn-flash'); void c.offsetWidth; c.classList.add('sn-flash');
      var r = c.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) window.scrollBy({ top: r.top - 80, behavior: 'smooth' });
    });
    notes.push(nt);
  });
  if (!notes.length) { main.classList.remove('sn-pending'); return; }

  var desktop = false;
  function enterDesktop() {
    var mainRect = main.getBoundingClientRect();
    var col = notes[0].c.getBoundingClientRect();
    var left = col.left - mainRect.left, width = col.width;
    main.classList.add('sn-active');
    notes.forEach(function (nt) {
      // Drop Quarto's container class so its own margin layout (layoutMarginEls) ignores these notes.
      nt.c.classList.remove('column-container'); nt.c.classList.add('sn-note');
      nt.c.style.setProperty('grid-column', 'auto', 'important');
      nt.c.style.position = 'absolute'; nt.c.style.top = '0px'; nt.c.style.left = left + 'px';
      nt.c.style.width = width + 'px'; nt.c.style.height = 'auto'; nt.c.style.margin = '0';
      nt.inner.style.marginTop = '0px';
    });
    desktop = true;
  }
  function exitDesktop() {
    main.classList.remove('sn-active'); main.style.minHeight = '';
    notes.forEach(function (nt) {
      nt.c.classList.add('column-container'); nt.c.classList.remove('sn-note', 'sn-collapsed', 'sn-expanded');
      nt.c.style.cssText = ''; nt.inner.style.maxHeight = ''; nt.inner.style.marginTop = '';
    });
    desktop = false;
  }
  // Position notes in place (no reset), so `top` changes can animate.
  function place() {
    var mainRect = main.getBoundingClientRect();
    var items = notes.map(function (nt) {
      nt.c.classList.remove('sn-collapsed', 'sn-expanded'); nt.inner.style.maxHeight = '';
      var natural = nt.c.offsetHeight; // includes the paragraph's bottom margin
      var rr = nt.ref.getBoundingClientRect();
      return { nt: nt, refY: rr.top - mainRect.top - 2, natural: natural };
    }).sort(function (a, b) { return a.refY - b.refY; });
    var y = -Infinity, maxBottom = 0;
    items.forEach(function (it, i) {
      it.y = Math.max(it.refY, y);
      var nextRef = i + 1 < items.length ? items[i + 1].refY : Infinity;
      var avail = nextRef - it.y - GAP;
      if (it.nt.expanded) { it.h = it.natural + TOGGLE_H; it.state = 'expanded'; }
      else if (it.natural > avail + 4) {
        it.h = Math.max(MIN_H, Math.min(it.natural, avail));
        if (it.h >= it.natural) { it.h = it.natural; it.state = 'plain'; } else it.state = 'collapsed';
      } else { it.h = it.natural; it.state = 'plain'; }
      y = it.y + it.h + GAP; maxBottom = Math.max(maxBottom, it.y + it.h);
    });
    items.forEach(function (it) {
      var nt = it.nt;
      nt.c.style.top = it.y + 'px';
      if (it.state === 'collapsed') { nt.c.classList.add('sn-collapsed'); nt.inner.style.maxHeight = (it.h - TOGGLE_H) + 'px'; nt.btn.textContent = 'more ▾'; }
      else if (it.state === 'expanded') { nt.c.classList.add('sn-expanded'); nt.inner.style.maxHeight = it.natural + 'px'; nt.btn.textContent = 'less ▴'; }
    });
    var need = maxBottom + 24 > mainRect.height ? (maxBottom + 24) + 'px' : '';
    if (main.style.minHeight !== need) main.style.minHeight = need;
  }
  function layout() {
    var wide = window.innerWidth >= BREAK;
    if (desktop) exitDesktop();
    if (!wide) return;
    enterDesktop(); place();
  }
  function animate(fn) {
    main.classList.add('sn-animate'); fn();
    setTimeout(function () { main.classList.remove('sn-animate'); }, 260);
  }
  // Safety net: if anything else writes a margin-top onto a note, undo it before paint.
  var mo = new MutationObserver(function (muts) {
    if (!desktop) return;
    muts.forEach(function (m) { var t = m.target; if (t.style.marginTop && t.style.marginTop !== '0px') t.style.marginTop = '0px'; });
  });
  notes.forEach(function (nt) { mo.observe(nt.inner, { attributes: true, attributeFilter: ['style'] }); });

  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(layout, 60); }
  layout();
  window.addEventListener('resize', schedule);
  ['shown.bs.collapse','hidden.bs.collapse'].forEach(function (ev) { document.addEventListener(ev, function () { animate(function () { if (desktop) place(); else schedule(); }); }); });
  main.querySelectorAll('img').forEach(function (img) { if (!img.complete) img.addEventListener('load', schedule); });
  // Reveal once fonts and images are in, so notes don't visibly jump around after load.
  var ready = [];
  if (document.fonts && document.fonts.ready) ready.push(document.fonts.ready);
  if (document.readyState !== 'complete') ready.push(new Promise(function (r) { window.addEventListener('load', r); }));
  Promise.all(ready).then(function () { layout(); main.classList.remove('sn-pending'); });
  setTimeout(function () { main.classList.remove('sn-pending'); }, 3000);
})();
</script>
